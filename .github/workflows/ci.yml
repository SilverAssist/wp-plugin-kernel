name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call: {}

jobs:
  quality-checks:
    name: Quality Checks (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.2.2

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --no-progress --optimize-autoloader

      - name: Check code standards
        run: composer phpcs

      - name: Run static analysis
        run: composer phpstan

      - name: Run tests
        run: composer phpunit

      # No WordPress Test Suite needed: AbstractPlugin/LoadableInterface
      # have no WordPress function calls, and the fixture-based unit tests
      # exercise pure PHP behavior. Testing\TestCase (which does extend
      # WP_UnitTestCase) only gets exercised once a real plugin consumes
      # this package.
